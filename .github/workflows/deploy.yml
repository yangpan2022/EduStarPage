name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}

      # A deploy that gets killed mid-transfer leaves the action's ".in.<name>"
      # staging file behind on the server, and every later run then dies with
      #   FTPError: 550 ... Temporary hidden file ... already exists
      # Remove any such leftovers before syncing. Never fail the job here.
      - name: Clean up leftover FTP staging files
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          commands=()
          while IFS= read -r f; do
            dir=$(dirname "$f")
            [ "$dir" = "." ] && dir=""
            commands+=(-Q "*DELE /${dir}/.in.$(basename "$f")")
          done < <(cd out && find . -type f -printf '%P\n')
          echo "staging paths checked: $(( ${#commands[@]} / 2 ))"

          curl -sS -v -u "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_HOST:$FTP_PORT/" "${commands[@]}" \
            -o /dev/null > "$RUNNER_TEMP/ftp-cleanup.log" 2>&1

          echo "DELE sent     : $(grep -c '^> DELE' "$RUNNER_TEMP/ftp-cleanup.log")"
          echo "DELE succeeded: $(grep -c '^< 250' "$RUNNER_TEMP/ftp-cleanup.log")"
          echo "unexpected replies:"
          grep -E '^< [45][0-9][0-9] ' "$RUNNER_TEMP/ftp-cleanup.log" | grep -v '^< 550 ' | head -5

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./out/
          server-dir: ./
          # Default is 30000 ms. Hostinger's FTP control socket goes idle while a
          # larger file transfers, which killed the deploy with
          # "Error: Timeout (control socket)". Give each operation real headroom.
          timeout: 300000
