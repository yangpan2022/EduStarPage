name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}

      # A deploy that gets killed mid-transfer leaves the action's ".in.<name>"
      # staging file behind on the server, and every later run then dies with
      #   FTPError: 550 ... Temporary hidden file ... already exists
      # Remove any such leftovers before syncing. Never fail the job here.
      - name: Clean up leftover FTP staging files
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          URL="ftp://$FTP_HOST:$FTP_PORT"
          TARGET="_not-found/.in.__next._index.txt"
          probe() {
            echo "----- $1"
            shift
            curl -sS -v -u "$FTP_USERNAME:$FTP_PASSWORD" "$URL/" "$@" -o /dev/null 2>&1 \
              | grep -E '^[<>] (PWD|DELE|CWD|550|250|257|530)' | head -12
          }

          echo "===== login directory"
          probe "PWD" -Q "PWD"
          echo "===== listing /"
          curl -sS -u "$FTP_USERNAME:$FTP_PASSWORD" "$URL/" 2>&1 | head -20
          echo "===== listing /_not-found/"
          curl -sS -u "$FTP_USERNAME:$FTP_PASSWORD" "$URL/_not-found/" 2>&1 | head -20

          echo "===== delete attempts"
          probe "absolute path"     -Q "*DELE /$TARGET"
          probe "relative path"     -Q "*DELE $TARGET"
          probe "cwd + basename"    -Q "CWD /_not-found" -Q "*DELE .in.__next._index.txt" -Q "CWD /"
          probe "full server path"  -Q "*DELE /domains/edustarcorp.com/public_html/$TARGET"

          echo "===== leftovers still present in /_not-found/"
          curl -sS -u "$FTP_USERNAME:$FTP_PASSWORD" "$URL/_not-found/" 2>&1 | grep -F '.in.' || echo "(none)"

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./out/
          server-dir: ./
          # Default is 30000 ms. Hostinger's FTP control socket goes idle while a
          # larger file transfers, which killed the deploy with
          # "Error: Timeout (control socket)". Give each operation real headroom.
          timeout: 300000
