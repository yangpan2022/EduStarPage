name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}

      # A deploy that gets killed mid-transfer leaves a hidden staging file
      # behind (the FTP client uploads to ".in.<name>." and then renames), and
      # every later run then dies with
      #   FTPError: 550 ... Temporary hidden file ... already exists
      # Sweep every directory for such leftovers before syncing. Never fail here.
      #
      # Paths must be RELATIVE to the login directory (public_html): this FTP
      # account answers 550 to "/_not-found" even though that directory exists,
      # so a leading slash silently turned every earlier DELE into a no-op.
      # curl -v is required, otherwise the server reply never reaches the log.
      - name: Clean up leftover FTP staging files
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          url="ftp://$FTP_HOST:$FTP_PORT"
          dirs=()
          while IFS= read -r d; do dirs+=("$d"); done < <(cd out && find . -type d -printf '%P\n')
          echo "scanning ${#dirs[@]} directories"

          found=0
          removed=0
          for d in "${dirs[@]}"; do
            path="$url/"
            [ -n "$d" ] && path="$url/$d/"
            listing=$(curl -sS -u "$FTP_USERNAME:$FTP_PASSWORD" "$path" 2>/dev/null)
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              found=$((found + 1))
              rel="$name"
              [ -n "$d" ] && rel="$d/$name"
              reply=$(curl -sS -v -u "$FTP_USERNAME:$FTP_PASSWORD" "$url/" \
                -Q "DELE $rel" -o /dev/null 2>&1 | grep -E '^< ' | tail -2 | tr '\n' ' ')
              echo "leftover: $rel -> $reply"
              case "$reply" in
                *250*) removed=$((removed + 1)); continue ;;
              esac
              # The staging name ends with a dot; retry without it just in case.
              alt="${rel%.}"
              if [ "$alt" != "$rel" ]; then
                reply2=$(curl -sS -v -u "$FTP_USERNAME:$FTP_PASSWORD" "$url/" \
                  -Q "DELE $alt" -o /dev/null 2>&1 | grep -E '^< ' | tail -2 | tr '\n' ' ')
                echo "  retry without trailing dot: $alt -> $reply2"
                case "$reply2" in
                  *250*) removed=$((removed + 1)) ;;
                esac
              fi
            done < <(printf '%s\n' "$listing" | awk '$NF ~ /^\.in\./ { print $NF }')
          done
          echo "leftovers found: $found, deleted: $removed"

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./out/
          server-dir: ./
          # Default is 30000 ms. Hostinger's FTP control socket goes idle while a
          # larger file transfers, which killed the deploy with
          # "Error: Timeout (control socket)". Give each operation real headroom.
          timeout: 300000
